name: Daily OpenRouter Sync

on:
  schedule:
    # Run once daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run OpenRouter Sync
        run: npm run sync:openrouter

      - name: Commit and Push if Changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/models.json src/data/sync_meta.json src/data/intelligence_data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(sync): update models from OpenRouter [skip ci]" && git push)
